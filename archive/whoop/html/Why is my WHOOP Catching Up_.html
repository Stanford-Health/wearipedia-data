<style id="themeCSS"></style><style id="customCSS">/* Changed in Web Interface:

  **CSS**
    - Remove old CSS
    - Add the content of this file

  **Files**
    - Create Library
    - Upload files to library (logo/social icons/hero) 
    - Add files as assets and set visibility

  **Footer (Needs to be set in HOME and TOPIC DETAILS)** [CSS dependent]
    - Update Footer HTML 
      - ATTENTION: Update language in html content depending on site
        - english: ["MORE", "Back to WHOOP.com", "SOCIAL MEDIA"]
        - german: ["MEHR", "Zurück zu WHOOP.com", "SOZIALE MEDIEN"]
        - french: ["PLUS D'OPTIONS", "Retour sur le site whoop.com", "RÉSEAUX SOCIAUX"]

  **Compact Header (Needs to be set in HOME and TOPIC DETAILS)** [CSS dependent]
    - Background & Borders:
      - Set "Color" to rgb(0, 0, 0)
      - Remove Background Image
      - Set "Image Overlay Color" to rgba(0, 0, 0, 0.5)
      - Set "Bottom Border Color" to rgba(0, 0, 0, 0.0)
    - Links:
      - Set "Link Color" to rgb(255, 255, 255)
      - Set "Link Hover Color" to rgb(255, 255, 255)
      - Set "Link Active Border Color" to rgb(255, 255, 255)
      - Set "Link Text Shadow" to rgba(0, 0, 0, 0.0)
    - Dropdown Menus:
      - Set "Menu Text Color" to "Use Theme Color"
      - Set "Menu Text Hover Color" to "Use Theme Color"
      - Set "Menu Background Color" to rgb(255, 255, 255)
      - Set "Menu Background Hover Color" to "Use Theme Color"
      - Set "Menu Divider Color" to rgb(240, 240, 240)
    - Layout:
      - Check "Set max header width"
      - Set "Max Header Width (640px - 1920px)" to 1440px
      - Set "Header Height (5px - 75px)" to 24px
      - Set "Logo Width (25px - 250px)" to 169px
      - Uncheck "Show Search" // Check! on Topic Details (Search Style: Collapsed)
      - Uncheck "Show App Launcher"
      - Uncheck "Show Notifications"
      - Uncheck "Show User Profile Menu"
      - Uncheck "Center Logo"
    - Set "User Profile Component" to "Customisable User Profile Menu"
    - Set "Search Component" to "Search"
    - Set "Navigation Component" to "Theme Navigation Menu"

  **Hero**
    - Hero Type:
      - Set "Hero Type" to "Search"
    - Background:
      - Set "Color" to rgb(40, 31, 35)
      - Set "Image" to hero image
      - Set "Image Layout" to "Scale to Fill"
      - Set "Image Position" to "Center"
      - Set "Image Overlay Color" to rgba(0, 0, 0, 0.5)
    - Layout:
      - Check "Set max hero width"
      - Set "Max Hero Width (640px - 1920px)" to 1440px
      - Set "Hero Height (0px - 300px)" to 200px
      - Set "Content Width (25% - 100%)" to 55%
      - Set "Content Alignment" to "Center"
    - Content:
      - Uncheck "Show Caption Text"
      - Check "Show Title Text"
      - Set Title Text to "How can we help you?" / "Wie können wir Ihnen helfen?" / "En quoi pouvons-nous vous aider?"
        ATTENTION: Set language depending on site
      - Set "Title Text Color" to rgb(255, 255, 255)
      - Set "Title Text Shadow Color" to rgba(0, 0, 0, 0.5)
    - Set "Search Component" to "Search"

  **Hero Search** [CSS dependent]
    - Set Placeholder to "Ask a question..." / "Stelle eine Frage..." / "Poser une question..." 
    - Autocomplete:
      - Check "Use automcomplete in searches"
      - Set "Max Autocomplete Results (1 - 10)" to 6
      - Add [Discussions, Topics] to "Objects in Autocomplete Results"
    - Style: General
      - Set "Border Style" to Full outline
      - Set "Border Radius" to 12px
      - Set "Input Text Color" to rgba(0, 0, 0, 0.8)
      - Set "Input Background Color" to rgba(255, 255, 255, 0.5)
      - Set "Input Icon Color" to rgb(255, 255, 255)
      - Set "Border Color" to rgba(0, 0, 0, 0)
      - Set "Placeholder Text Color" to rgb(0, 0, 0)
      - Uncheck "Outline search field on focus"
      - Check "Show search button"
      - Set "Button Background Color" to rgb(0, 0, 0)
      - Set "Button Background Hover Color" to rgba(0, 0, 0, 0.8)
    - Style: Autocomplete
      - Set "Text Color" to "Use Theme Color"
      - Set "Text Hover Color" to "Use Theme Color"
      - Set "Background Color" to rgb(255, 255, 255)
      - Set "Background Hover Color" to "Use Theme Color"
      - Set "Divider Color" to rgb(240, 240, 240)

  **Featured Topics** [CSS dependent]
    - Add Featured Topics Images in Content Management
    - Add Files to folder in library (Since they need to be uploaded in this preceding step and can't be uploaded via the files meny) [optional]
    - Set "Title" to "Featured Topics"
    - Uncheck "Show Title"

      - Set "Overlay Hover Color" to rgba(0, 0, 0, 0)

      - Set "Text Hover Color" to rgb(0, 0, 0)

/* Footer Container - CORE */
.footer .custom-footer {
  align-items: flex-start;
  background:black;
  box-sizing: border-box;
  color: #fff;
  display: flex;
  padding: 3%;
}

.footer .custom-footer > div {
  flex: 1;
}

/* Footer Container - MOBILE */
@media only screen and (max-width: 48em) {
  .footer .custom-footer {
    flex-direction: column;
    padding: 7%;
    row-gap: 32px;
  }
}

/* Footer Logo - CORE */
.footer .custom-footer .custom-footer__logo {
  order: 1;
}

.footer .custom-footer .custom-footer__logo img {
  width: 125px;
}

/* Footer Logo - MOBILE */
@media only screen and (max-width: 48em) {
  .footer .custom-footer .custom-footer__logo {
    order: 1;
  }
}

/* Footer More - CORE */
.footer .custom-footer .custom-footer__more {
  display: flex;
  flex-flow: column nowrap;
  row-gap: 16px;
  order: 2;
}

.footer .custom-footer .custom-footer__more a {
  color: #fff;
  cursor:pointer; 
  font-size: 15px;
}

.footer .custom-footer .custom-footer__more b {
  font-size: 13px;
}

.footer .custom-footer .custom-footer__more .custom-footer__more-coryright {
  display: none;
  margin-top: 30px;
}

/* Footer More - DESKTOP */
@media only screen and (min-width: 769px) {
  .footer .custom-footer .custom-footer__more a:hover {
    color: #fff;
    text-decoration: underline;
  }
}

/* Footer More - MOBILE */
@media only screen and (max-width: 48em) {
  .footer .custom-footer .custom-footer__more .custom-footer__more-coryright {
    display: initial;
  }

  .footer .custom-footer .custom-footer__more {
    row-gap: 16px;
    order: 3;
  }
}

/* Footer Social - Core */
.footer .custom-footer .custom-footer__social-media {
  display: flex;
  flex-direction: column;
  row-gap: 24px;
  order: 3;
}

.footer .custom-footer .custom-footer__social-media p {
  font-size: 11px;
  font-weight: 800;
  margin-bottom: 0;
}

.footer .custom-footer .custom-footer__social-media-icon-container {
  display: flex;
  flex-direction: row;
  column-gap: 10px;
}

.footer .custom-footer .custom-footer__social-media .custom-footer__social-media-coryright {
  display: initial;
}

.footer .custom-footer .custom-footer__social-media .social-link > .social-icon {
  display: inline-block;
  height: 14px;
  width: 14px;
}

.footer .custom-footer .custom-footer__social-media .social-link > .social-icon-fill {
  display: none;
  height: 14px;
  width: 14px;
}

.footer .custom-footer .custom-footer__social-media .social-link {
  border: 2px solid white;
  border-radius: 50%;
  display: inline-flex;
  flex-shrink: 0;
  padding: 10px;
}

/* Footer Social - DESKTOP */
@media only screen and (min-width: 769px) {
  .footer .custom-footer .custom-footer__social-media .social-link:hover {
    background-color: white;
    cursor: pointer;
  }

  .footer .custom-footer .custom-footer__social-media .social-link:hover > .social-icon-fill {
    display: inline-block;
    height: 14px;
    width: 14px;
  }

  .footer .custom-footer .custom-footer__social-media .social-link:hover > .social-icon {
    display: none;
    height: 14px;
    width: 14px;
  }
}

/* Footer Social - MOBILE */
@media only screen and (max-width: 48em) {
  .footer .custom-footer .custom-footer__social-media .custom-footer__social-media-coryright {
    display: none;
  }

  .footer .custom-footer .custom-footer__social-media {
    row-gap: 24px;
    order: 2;
  }
}

  display: none;
}

  background: none;
	color: grey;
	border: none;
	padding: 0;
	font: inherit;
	cursor: pointer;
	outline: inherit;

  box-shadow: none;
}

.forceCommunityLanguageSelector43 .slds-dropdown {
  left: auto;
  right: 0;

  top: auto;

  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 5px;
}

  position:static;
  cursor: pointer;
}

  position:static;
}

.forceCommunityLanguageSelector43 lightning-icon svg path {
  fill: grey;
}

.forceCommunityLanguageSelector43 span {
  font-weight: 600;

.forceCommunityLanguageSelector43 span::before {
  font-size: 18px;
  padding-right: 5px;
  transform: translateY(2px);
}

.forceCommunityLanguageSelector43 button[data-value="German"] span::before {

.forceCommunityLanguageSelector43 button[data-value="Latin American Spanish"] span::before {
  content: "🇪🇸";
}

.forceCommunityLanguageSelector43 button[data-value="Italian"] span::before {
  content: "🇮🇹";
